name: CivicSignal verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: node --experimental-strip-types --test scripts/*.test.mjs
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web build
      - name: Fresh data directory, migrations, worker and restart
        run: python scripts/verify_startup.py --output artifacts/verification/ci-startup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-verification
          path: artifacts/verification/ci-startup.json
  docker-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: civicsignal-ci
      CIVIC_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Clear checked-in local results before recording this runner
        run: rm -f -- artifacts/verification/completion-browser.json artifacts/verification/browser-results.json artifacts/verification/water-review-evidence.json artifacts/verification/water-history.json artifacts/verification/domain-timeline.json
      - name: Build and start disposable PostgreSQL demo stack
        run: docker compose up --build --wait --wait-timeout 240
      - name: All seven human review workflows and water operations
        run: node scripts/completion-browser-check.mjs
      - name: Water review evidence, lost confirmation retry and stale configuration
        run: node scripts/water-review-evidence-check.mjs
      - name: Browser regression checks (sequential; shared test database)
        run: node scripts/browser-check.mjs
      - name: Historical supply records and multi-meter comparison
        run: node scripts/water-history-check.mjs
      - name: Shared domain chart timelines and scoped exports
        run: node scripts/domain-timeline-check.mjs
      - name: Preserve PostgreSQL evidence across application restart
        shell: bash
        run: |
          before=$(docker compose exec -T db psql -U civic -d civic -Atc "SELECT count(*) FROM evidence")
          test "$before" -gt 0
          docker compose restart app
          docker compose up --wait --wait-timeout 240
          after=$(docker compose exec -T db psql -U civic -d civic -Atc "SELECT count(*) FROM evidence")
          test "$before" = "$after"
          curl --fail http://127.0.0.1:8000/api/v1/health
      - name: Container diagnostics
        if: always()
        run: docker compose logs --no-color --tail 150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-browser-verification
          path: |
            artifacts/verification/completion-browser.json
            artifacts/verification/browser-results.json
            artifacts/verification/water-review-evidence.json
            artifacts/verification/water-history.json
            artifacts/verification/domain-timeline.json
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes
