name: Python 3.14 Windows compatibility
on:
  pull_request:
  push:
    branches:
      - improve/light-theme-settings-py314-20261017
jobs:
  python314-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install binary-only Python 3.14 dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-py314.txt'
      - name: Check resolved dependencies
        run: python -m pip check
      - name: Verify backend tests on Python 3.14
        run: python -m pytest tests -q
